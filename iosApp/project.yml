name: MokaReader
options:
  bundleIdPrefix: cl.jonas
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Generated with XcodeGen:  cd iosApp && xcodegen generate
#
# Not in git, produced by CI (see .github/workflows/ios-testflight.yml):
#   Vendor/jvm/OpenJDK.xcframework   Scripts/build-openjdk-ios15.sh
#   Resources/JVM/                   Scripts/build-jvm-runtime.sh + stage-jvm-resources.sh device

packages:
  # Swift/JNI bridge to the embedded VM. Written for Wizard Cat Reader
  # (Apache-2.0) against the JNI spec and the Apache extension-host protocol.
  WizardJVMRunner:
    path: Packages/WizardJVMRunner
  # Reads imported CBZ/ZIP comics (MIT).
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19

targets:
  MokaReader:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # The JVM runtime is resolved by name from the bundle root, so these land flattened.
      - path: Resources/JVM/java_bundle
        type: folder
        buildPhase: resources
      - path: Resources/JVM/tachiaz-compat
        type: folder
        buildPhase: resources
      - path: Resources/JVM/tachiaz-extension-host.jar
        buildPhase: resources
      - path: Resources/JVM/tachiaz-mobile-shims.jar
        buildPhase: resources
      # The guide comic seeded into the library on first launch.
      - path: Resources/SampleComics/guia-wizard-cat.cbz
        buildPhase: resources
      # English translation table; the Spanish source strings are the keys.
      # As a folder it lands as en.lproj/ at the bundle root, where NSBundle looks.
      - path: Resources/Localization/en.lproj
        type: folder
        buildPhase: resources
    dependencies:
      # Static library: linked, never embedded.
      - framework: Vendor/jvm/OpenJDK.xcframework
        embed: false
        link: true
      - package: WizardJVMRunner
      - package: ZIPFoundation
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
          - en
        CFBundleDisplayName: "Wizard Cat Reader"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Extension sources and self-hosted servers (Komga) can be any host the user adds.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Wizard Cat Reader se conecta a servidores de manga propios, como Komga, en tu red local.
        # So the Files picker offers .cbz archives when importing comics.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: cl.jonas.wizardcat.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
    settings:
      base:
        # The App Store Connect record "MokaReader" was created with this identifier.
        PRODUCT_BUNDLE_IDENTIFIER: cl.jonas.tachitest
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # v1 es solo iPhone: declarar iPad obliga a subir capturas de iPad 13" en ASC.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Íconos alternativos elegibles desde Ajustes → Apariencia.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconNight AppIconTerra"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "NO"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The statically linked VM has no dynamic framework to carry its own dependencies.
        OTHER_LDFLAGS: "-lz -liconv -lc++ -framework CoreGraphics -framework CoreText -framework ImageIO -framework JavaScriptCore -framework Security"
